services:
  mysql:
    image: mysql:8.0
    container_name: ledger-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"   # change to "3307:3306" if you already run MySQL locally
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: instructor_revenue_ledger
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: